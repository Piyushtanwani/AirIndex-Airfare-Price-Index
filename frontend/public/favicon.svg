<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b29" />
      <stop offset="100%" stop-color="#091b1a" />
    </linearGradient>
    <linearGradient id="fav-wing-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="fav-wing-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="fav-contrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="fav-bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Container Squircle with Glowing Teal Edge -->
  <rect x="1.5" y="1.5" width="37" height="37" rx="9.5" fill="url(#fav-bg)" stroke="#14b8a6" stroke-width="1.4" stroke-opacity="0.4" />

  <!-- Index Basket Bars -->
  <rect x="7" y="23" width="2.5" height="8" rx="1.25" fill="url(#fav-bars)" />
  <rect x="11.5" y="19" width="2.5" height="12" rx="1.25" fill="url(#fav-bars)" />
  <rect x="16" y="15" width="2.5" height="16" rx="1.25" fill="url(#fav-bars)" />

  <!-- Ascending Flight Contrail / Price Trend Arc -->
  <path d="M 6 31 C 12 31, 16 26, 21 19 C 24 15, 28 10.5, 33 7.5" stroke="url(#fav-contrail)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Delta Wing Jet Airframe (Upper Facet) -->
  <path d="M 33.5 7 L 12 18 L 22 21 L 33.5 7 Z" fill="url(#fav-wing-light)" />

  <!-- Delta Wing Jet Airframe (Lower Depth Facet) -->
  <path d="M 33.5 7 L 22 21 L 24.5 29.5 L 26.8 23.8 L 33.5 7 Z" fill="url(#fav-wing-dark)" />

  <!-- Fuselage Dorsal Highlight -->
  <path d="M 33.5 7 L 22 21" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- Apex Indicator Beacon -->
  <circle cx="33.5" cy="7" r="2.4" fill="#5eead4" fill-opacity="0.5" />
  <circle cx="33.5" cy="7" r="1.4" fill="#ffffff" />
</svg>