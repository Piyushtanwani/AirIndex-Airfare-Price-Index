# AirIndex route basket.
#
# The basket is the set of city pairs priced by the index. Fifteen routes across
# five booking lead times gives 75 priced cells.
#
# `weight` is the route's share of the index. See weights.yaml for the source and
# the caveat that applies to it. The weights here are the normalised values used at
# runtime and are regenerated from weights.yaml by `airindex weights-sync`.
#
# `base_fare_inr` and the shape parameters are used ONLY by the synthetic source to
# generate plausible fares. They have no effect on the index when a real source is used.

